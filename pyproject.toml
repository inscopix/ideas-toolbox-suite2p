[project]
name = "ideas-toolbox-suite2p"
description = "IDEAS Suite2p Toolkit"
requires-python = ">=3.10,<3.11"
classifiers = [
    "Programming Language :: Python :: 3"
]
dependencies = []

dynamic = ["version"]

[tool.setuptools.packages.find]
exclude = ['data', 'outputs']

[dependency-groups]
analysis = [
    "ideas-python[analysis]==1.3.2",
    "pynwb==2.8.1",
    "hdmf==3.14.0",
    "dandi==0.63.0",
    "numpy==1.26.4",
    "scikit-learn==1.4.2",
    "scipy==1.13.0",
    "suite2p@git+https://@github.com/inscopix/isxSuite2p.git@955260df36f7beb532742cfe4801fe2edc9a16ae",
    "imageio[ffmpeg]==2.33.0",
    "pytest==7.4.2",
    "isx==2.1.0",
    "beartype",
    "scikit-image",
    "opencv-python",
    "seaborn",
    "setuptools",
    "urllib3==2.7.0",
    "cryptography==48.0.1",
]
test = [
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "pytest-order",
    "pytest-watch",
]
dev = [
    "pre-commit",
    "ruff",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = [
  "."
]

[tool.ruff]
# flake8-builtins (A)
# pycodestyle errors (E) and warnings (W)
# pyflakes (F)
# isort (I)
lint.select = ["A", "E", "W", "F", "I"]
show-fixes = true
line-length = 88
# Be permissive of long lines
lint.ignore = ["E501", "A005"]
target-version = "py313"
extend-exclude = ["venv", "venv_test", "venv3", ".venv"]

[tool.ruff.lint.isort]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.pydocstyle]
add-ignore = ["D104"]  # ignore missing package docstring to reduce noise
