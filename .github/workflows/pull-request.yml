name: pull-request

on:
  push:
    branches: ["main"]
  pull_request:
    # trigger all branches

permissions:
  contents: read

jobs:
  pull-request-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v6
      with:
          persist-credentials: false
    - name: Set up Python 3.13
      uses: actions/setup-python@v6
      with:
        python-version: '3.13.11'
    # Setup uv and handle caching
    - name: Setup uv
      uses: astral-sh/setup-uv@v7
      with:
        version: '0.10.7'
        # Caches the uv executable and its internal cache directories
        cache-dependency-path: uv.lock
    # Create a virtual environment and install dependencies
    # First check to ensure uv.lock is synced with pyproject.toml
    # Fail check otherwise to ensure user updates lock file locally
    - name: Setup venv
      run: uv lock --check && make venv
    - name: Check code formatting
      run: make ruff-check
    - name: Check unit tests
      run: make test
